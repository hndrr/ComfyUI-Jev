name: Test nodes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-nodes:
    name: ComfyUI integration (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      DO_NOT_TRACK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out ComfyUI 0.39.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Comfy-Org/ComfyUI
          ref: b0b743566f65daafc423b4fea8a2fbda94b3384a
          path: ComfyUI
          persist-credentials: false
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ComfyUI/custom_nodes/ComfyUI-Jev
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ComfyUI/requirements.txt
            ComfyUI/custom_nodes/ComfyUI-Jev/pyproject.toml
            ComfyUI/custom_nodes/ComfyUI-Jev/.github/workflows/tests.yml
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install 'torch==2.14.1+cpu' 'torchvision==0.29.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ComfyUI/requirements.txt
          python - <<'PY'
          import pathlib, subprocess, sys, tomllib
          project = pathlib.Path('ComfyUI/custom_nodes/ComfyUI-Jev/pyproject.toml')
          dependencies = tomllib.loads(project.read_text())['project']['dependencies']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *dependencies])
          PY
      - name: Run all node tests without network access
        working-directory: ComfyUI
        run: |
          python -c "import torch; assert torch.version.cuda is None, 'CI requires CPU-only PyTorch'"
          python custom_nodes/ComfyUI-Jev/.github/scripts/run_node_tests.py --comfy-dir .
