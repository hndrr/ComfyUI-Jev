name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

concurrency:
  group: publish-comfy-registry
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish Custom Node
    if: github.repository == 'hndrr/ComfyUI-Jev' && github.event.repository.fork == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Check Registry token
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Add the hndr publisher API key as the REGISTRY_ACCESS_TOKEN repository secret."
            exit 1
          fi
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: 'true'
