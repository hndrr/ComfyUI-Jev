[project]
name = "comfyui-jev"
version = "1.1.0"
description = "Jev judgments and image localization for ComfyUI: candidate selection, scoring, number extraction, Skill selection, and rectangular crops and masks. Includes OpenRouter text generation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.11.8", "PyYAML"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/hndrr/ComfyUI-Jev"
Documentation = "https://github.com/hndrr/ComfyUI-Jev#readme"
"Bug Tracker" = "https://github.com/hndrr/ComfyUI-Jev/issues"

[tool.comfy]
PublisherId = "hndr"
DisplayName = "ComfyUI-Jev"
requires-comfyui = ">=0.36.0"
